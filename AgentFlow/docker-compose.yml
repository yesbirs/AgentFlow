services:

  api:
    build:
      context: .
      dockerfile: src/AgentFlow.API/Dockerfile
    container_name: agentflow-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: agentflow-postgres
    environment:
      POSTGRES_DB: AgentFlow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5400:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: