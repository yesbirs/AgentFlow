name: agentflow-servicebus

services:

  servicebus-emulator:
    container_name: agentflow-servicebus
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always

    volumes:
      - ./Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json

    ports:
      - "5672:5672"
      - "5300:5300"

    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "AgentFlow123!"
      ACCEPT_EULA: "Y"
      EMULATOR_HTTP_PORT: "5300"
      SQL_WAIT_INTERVAL: "15"

    depends_on:
      - mssql

    networks:
      sb-emulator:
        aliases:
          - "sb-emulator"

  mssql:
    container_name: agentflow-servicebus-sql
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AgentFlow123!"

    networks:
      sb-emulator:
        aliases:
          - "mssql"

networks:
  sb-emulator: